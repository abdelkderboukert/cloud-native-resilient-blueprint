apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-kong-ingress
  namespace: app-tier
  labels:
    app.kubernetes.io/name: django-kong-ingress
    app.kubernetes.io/part-of: enterprise-event-driven-micro-platform
  annotations:
    kubernetes.io/ingress.class: "kong"
    konghq.com/override: "django-ingress-config"
    konghq.com/plugins: "enterprise-rate-limiting,enterprise-correlation-id,enterprise-prometheus"
spec:
  rules:
  - host: api.enterprise.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: django-service
            port:
              number: 80
