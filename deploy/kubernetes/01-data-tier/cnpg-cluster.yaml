apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: data-tier
  labels:
    app.kubernetes.io/name: postgres-cluster
    app.kubernetes.io/part-of: enterprise-event-driven-micro-platform
spec:
  instances: 3
  imageName: ghcr.io/cloudnativepg/postgresql:16.2
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: enterprise-longhorn-sc
  bootstrap:
    initdb:
      database: enterprise_db
      owner: app_user
      secret:
        name: postgres-cluster-app
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      endpointURL: http://rustfs-service.data-tier.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: rustfs-secret
          key: access-key
        secretAccessKey:
          name: rustfs-secret
          key: secret-key
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
    retentionPolicy: "30 days"
