apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs-storage
  namespace: data-tier
spec:
  serviceName: rustfs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      containers:
      - name: rustfs
        image: rustfs/rustfs:latest
        ports:
        - containerPort: 9000
          name: s3-api
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: access-key
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: secret-key
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        volumeMounts:
        - name: rustfs-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: rustfs-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "enterprise-longhorn-sc"
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-service
  namespace: data-tier
spec:
  ports:
  - port: 9000
    targetPort: 9000
    name: s3-api
  selector:
    app.kubernetes.io/name: rustfs
