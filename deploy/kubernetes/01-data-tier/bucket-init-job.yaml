apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: data-tier
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-bucket-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: bucket-init
        image: minio/mc:latest
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: access-key
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: secret-key
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for RustFS S3 endpoint to become available..."
          until mc alias set rustfs http://rustfs-service:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" --api S3v4; do
            echo "Waiting for rustfs-service:9000..."
            sleep 3
          done
          echo "Connected to RustFS. Ensuring bucket 'postgres-backups' exists..."
          mc mb --ignore-existing rustfs/postgres-backups
          mc anonymous set none rustfs/postgres-backups
          echo "Bucket 'postgres-backups' provisioned successfully."
