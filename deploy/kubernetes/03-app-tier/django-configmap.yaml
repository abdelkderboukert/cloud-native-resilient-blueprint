apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: app-tier
  labels:
    app.kubernetes.io/name: django-api
    app.kubernetes.io/part-of: enterprise-event-driven-micro-platform
data:
  DJANGO_SETTINGS_MODULE: "enterprise_platform.settings"
  DEBUG: "False"
  ALLOWED_HOSTS: "api.enterprise.local,django-service,django-service.app-tier.svc.cluster.local,localhost,127.0.0.1"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-0.kafka-headless.messaging-tier.svc.cluster.local:9092"
  KAFKA_USER_EVENTS_TOPIC: "user.lifecycle.events"
  KAFKA_ARTICLE_EVENTS_TOPIC: "article.lifecycle.events"
  CORS_ALLOW_ALL_ORIGINS: "False"
  LOG_LEVEL: "INFO"
