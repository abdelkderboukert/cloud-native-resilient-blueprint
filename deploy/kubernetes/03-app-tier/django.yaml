apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-api
  namespace: app-tier
  labels:
    app.kubernetes.io/name: django-api
    app.kubernetes.io/part-of: enterprise-event-driven-micro-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: django-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: django
        image: ghcr.io/user/django-enterprise-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: django-config
        env:
        - name: DATABASE_URL
          value: "postgres://app_user:secure_password@postgres-cluster-rw.data-tier.svc.cluster.local:5432/enterprise_db"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-broker-0.kafka-headless.messaging-tier.svc.cluster.local:9092"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: DJANGO_SECRET_KEY
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /readyz/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: app-tier
  labels:
    app.kubernetes.io/name: django-api
    app.kubernetes.io/part-of: enterprise-event-driven-micro-platform
spec:
  ports:
  - port: 80
    targetPort: 8000
    name: http
  selector:
    app.kubernetes.io/name: django-api
