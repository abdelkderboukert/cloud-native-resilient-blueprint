apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-platform-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: enterprise-event-driven-micro-platform
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: enterprise-platform
  source:
    repoURL: https://github.com/abdelkderboukert/cloud-native-resilient-blueprint.git
    targetRevision: main
    path: deploy/helm/enterprise-platform
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
