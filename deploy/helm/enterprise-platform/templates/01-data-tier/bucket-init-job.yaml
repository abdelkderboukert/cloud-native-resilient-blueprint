{{- if and .Values.dataTier.rustfs.enabled .Values.dataTier.rustfs.bucketInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rustfs-bucket-init
  namespace: {{ .Values.namespaces.dataTier }}
  labels:
    app.kubernetes.io/name: rustfs-bucket-init
    {{- include "enterprise-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-bucket-init
        {{- include "enterprise-platform.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: bucket-init
        image: {{ .Values.dataTier.rustfs.bucketInit.image | quote }}
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dataTier.rustfs.credentials.secretName }}
              key: access-key
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dataTier.rustfs.credentials.secretName }}
              key: secret-key
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for RustFS endpoint..."
          until mc alias set rustfs http://rustfs-service:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" --api S3v4; do
            echo "Waiting for rustfs-service:9000..."
            sleep 3
          done
          echo "Connected to RustFS. Ensuring bucket '{{ .Values.dataTier.rustfs.bucketInit.targetBucket }}' exists..."
          mc mb --ignore-existing rustfs/{{ .Values.dataTier.rustfs.bucketInit.targetBucket }}
          mc anonymous set none rustfs/{{ .Values.dataTier.rustfs.bucketInit.targetBucket }}
          {{- if .Values.clusterBackup.velero.enabled }}
          mc mb --ignore-existing rustfs/{{ .Values.clusterBackup.velero.bucket }}
          mc anonymous set none rustfs/{{ .Values.clusterBackup.velero.bucket }}
          {{- end }}
          echo "Bucket provisioned."
{{- end }}
