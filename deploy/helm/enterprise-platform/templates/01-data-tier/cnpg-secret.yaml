{{- if .Values.dataTier.cnpg.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dataTier.cnpg.credentials.secretName }}
  namespace: {{ .Values.namespaces.dataTier }}
  labels:
    cnpg.io/cluster: {{ .Values.dataTier.cnpg.clusterName }}
    {{- include "enterprise-platform.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.dataTier.cnpg.owner | quote }}
  password: {{ .Values.dataTier.cnpg.password | quote }}
{{- end }}
