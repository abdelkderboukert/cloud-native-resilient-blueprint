{{- if .Values.appTier.django.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appTier.django.name }}
  namespace: {{ .Values.namespaces.appTier }}
  labels:
    app.kubernetes.io/name: {{ .Values.appTier.django.name }}
    {{- include "enterprise-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appTier.django.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.appTier.django.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.appTier.django.name }}
        {{- include "enterprise-platform.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.appTier.django.securityContext | nindent 8 }}
      containers:
      - name: django
        image: "{{ .Values.appTier.django.image.repository }}:{{ .Values.appTier.django.image.tag }}"
        imagePullPolicy: {{ .Values.appTier.django.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: django-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: DATABASE_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-broker-0.kafka-headless.{{ .Values.namespaces.messagingTier }}.svc.cluster.local:9092"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: DJANGO_SECRET_KEY
        resources:
          {{- toYaml .Values.appTier.django.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /readyz/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
{{- end }}
