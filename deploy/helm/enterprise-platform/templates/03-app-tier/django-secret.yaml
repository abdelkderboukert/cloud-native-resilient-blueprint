{{- if .Values.appTier.django.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  namespace: {{ .Values.namespaces.appTier }}
  labels:
    app.kubernetes.io/name: {{ .Values.appTier.django.name }}
    {{- include "enterprise-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.appTier.django.secretKey | quote }}
  DATABASE_URL: "postgres://{{ .Values.dataTier.cnpg.owner }}:{{ .Values.dataTier.cnpg.password }}@{{ .Values.dataTier.cnpg.clusterName }}-rw.{{ .Values.namespaces.dataTier }}.svc.cluster.local:5432/{{ .Values.dataTier.cnpg.database }}"
{{- end }}
