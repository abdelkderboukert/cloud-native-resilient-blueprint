{{- if .Values.namespaces.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.dataTier }}
  labels:
    tier: data
    pod-security.kubernetes.io/enforce: baseline
    {{- include "enterprise-platform.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.messagingTier }}
  labels:
    tier: messaging
    pod-security.kubernetes.io/enforce: baseline
    {{- include "enterprise-platform.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.appTier }}
  labels:
    tier: application
    pod-security.kubernetes.io/enforce: restricted
    {{- include "enterprise-platform.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.ingressTier }}
  labels:
    tier: edge-routing
    pod-security.kubernetes.io/enforce: baseline
    {{- include "enterprise-platform.labels" . | nindent 4 }}
{{- end }}
