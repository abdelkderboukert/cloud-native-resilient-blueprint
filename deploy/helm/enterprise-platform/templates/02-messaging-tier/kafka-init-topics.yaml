{{- if and .Values.messagingTier.kafka.enabled .Values.messagingTier.kafka.topics.initJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kafka-init-topics
  namespace: {{ .Values.namespaces.messagingTier }}
  labels:
    app.kubernetes.io/name: kafka-init-topics
    {{- include "enterprise-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init-topics
        {{- include "enterprise-platform.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: topic-creator
        image: "{{ .Values.messagingTier.kafka.image.repository }}:{{ .Values.messagingTier.kafka.image.tag }}"
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Kafka broker to be ready..."
          cub kafka-ready -b kafka-broker-0.kafka-headless.{{ .Values.namespaces.messagingTier }}.svc.cluster.local:9092 1 60
          
          echo "Creating enterprise topics..."
          kafka-topics --bootstrap-server kafka-broker-0.kafka-headless.{{ .Values.namespaces.messagingTier }}.svc.cluster.local:9092 \
            --create --if-not-exists --topic {{ .Values.messagingTier.kafka.topics.userEvents }} --partitions 3 --replication-factor 1
            
          kafka-topics --bootstrap-server kafka-broker-0.kafka-headless.{{ .Values.namespaces.messagingTier }}.svc.cluster.local:9092 \
            --create --if-not-exists --topic {{ .Values.messagingTier.kafka.topics.articleEvents }} --partitions 3 --replication-factor 1

          echo "Enterprise topics provisioned successfully."
{{- end }}
