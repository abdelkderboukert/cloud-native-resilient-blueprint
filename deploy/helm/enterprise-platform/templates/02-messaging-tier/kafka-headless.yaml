{{- if .Values.messagingTier.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: {{ .Values.namespaces.messagingTier }}
  labels:
    app.kubernetes.io/name: kafka
    {{- include "enterprise-platform.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
  - port: 9092
    targetPort: 9092
    name: client
  - port: 9093
    targetPort: 9093
    name: controller
  selector:
    app.kubernetes.io/name: kafka
{{- end }}
