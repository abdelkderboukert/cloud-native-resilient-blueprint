# Default values for enterprise-platform Helm chart.
# Declare variables to be passed into your templates.

global:
  storageClass: "enterprise-longhorn-sc"
  domain: "enterprise.local"
  environment: "production"
  commonLabels: {}

# Namespace Configuration
namespaces:
  create: true
  dataTier: "data-tier"
  messagingTier: "messaging-tier"
  appTier: "app-tier"
  ingressTier: "ingress-tier"
  platformOps: "platform-ops"

# Global Infrastructure & Storage
infrastructure:
  storageClass:
    create: true
    numberOfReplicas: "2"
    staleReplicaTimeout: "2880"
    reclaimPolicy: "Retain"
    fsx: "ext4"
    allowVolumeExpansion: true
  networkPolicies:
    enabled: true
  accessControl:
    enabled: true
    auditor:
      enabled: true
      name: "enterprise-platform-auditor"
    superUsers:
      enabled: true
      group: "platform-superusers"
      clusterRole: "cluster-admin"
    projectServiceAccount:
      name: "enterprise-platform"
  resourceGovernance:
    enabled: true
    namespaces:
      dataTier:
        quota:
          requests.cpu: "12"
          requests.memory: "32Gi"
          limits.cpu: "24"
          limits.memory: "48Gi"
          requests.storage: "500Gi"
          persistentvolumeclaims: "20"
          pods: "30"
        container:
          min:
            cpu: "50m"
            memory: "64Mi"
          max:
            cpu: "4"
            memory: "8Gi"
          default:
            cpu: "1"
            memory: "2Gi"
          defaultRequest:
            cpu: "250m"
            memory: "512Mi"
        pvc:
          min:
            storage: "1Gi"
          max:
            storage: "200Gi"
      messagingTier:
        quota:
          requests.cpu: "8"
          requests.memory: "16Gi"
          limits.cpu: "16"
          limits.memory: "32Gi"
          requests.storage: "200Gi"
          persistentvolumeclaims: "10"
          pods: "15"
        container:
          min:
            cpu: "50m"
            memory: "64Mi"
          max:
            cpu: "4"
            memory: "8Gi"
          default:
            cpu: "1"
            memory: "2Gi"
          defaultRequest:
            cpu: "250m"
            memory: "512Mi"
        pvc:
          min:
            storage: "1Gi"
          max:
            storage: "100Gi"
      appTier:
        quota:
          requests.cpu: "8"
          requests.memory: "8Gi"
          limits.cpu: "16"
          limits.memory: "16Gi"
          requests.storage: "30Gi"
          persistentvolumeclaims: "10"
          pods: "30"
        container:
          min:
            cpu: "50m"
            memory: "64Mi"
          max:
            cpu: "2"
            memory: "2Gi"
          default:
            cpu: "500m"
            memory: "512Mi"
          defaultRequest:
            cpu: "100m"
            memory: "128Mi"
        pvc:
          min:
            storage: "1Gi"
          max:
            storage: "20Gi"
      ingressTier:
        quota:
          requests.cpu: "4"
          requests.memory: "4Gi"
          limits.cpu: "8"
          limits.memory: "8Gi"
          requests.storage: "10Gi"
          persistentvolumeclaims: "5"
          pods: "15"
        container:
          min:
            cpu: "50m"
            memory: "64Mi"
          max:
            cpu: "2"
            memory: "2Gi"
          default:
            cpu: "500m"
            memory: "512Mi"
          defaultRequest:
            cpu: "100m"
            memory: "128Mi"
        pvc:
          min:
            storage: "1Gi"
          max:
            storage: "10Gi"
      platformOps:
        quota:
          requests.cpu: "2"
          requests.memory: "2Gi"
          limits.cpu: "4"
          limits.memory: "4Gi"
          requests.storage: "5Gi"
          persistentvolumeclaims: "3"
          pods: "10"
        container:
          min:
            cpu: "50m"
            memory: "64Mi"
          max:
            cpu: "2"
            memory: "2Gi"
          default:
            cpu: "500m"
            memory: "512Mi"
          defaultRequest:
            cpu: "100m"
            memory: "128Mi"
        pvc:
          min:
            storage: "1Gi"
          max:
            storage: "5Gi"

clusterBackup:
  velero:
    enabled: true
    namespace: "velero"
    scheduleName: "enterprise-platform-daily"
    schedule: "0 2 * * *"
    storageLocationName: "rustfs-cluster-backups"
    bucket: "cluster-backups"
    retention: "720h"
    region: "us-east-1"
    endpoint: "http://rustfs-service.data-tier.svc.cluster.local:9000"
    credentialsSecretName: "cloud-credentials"
    defaultVolumesToFsBackup: true

# 1. Object Storage & Stateful Database Tier
dataTier:
  rustfs:
    enabled: true
    name: "rustfs-storage"
    replicas: 1
    image:
      repository: "rustfs/rustfs"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    storage:
      size: "50Gi"
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"
    credentials:
      secretName: "rustfs-secret"
      accessKey: "enterprise-admin-key"
      secretKey: "enterprise-super-secret-key-32chars"
    bucketInit:
      enabled: true
      image: "minio/mc:latest"
      targetBucket: "postgres-backups"

  cnpg:
    enabled: true
    clusterName: "postgres-cluster"
    instances: 3
    image:
      repository: "ghcr.io/cloudnativepg/postgresql"
      tag: "16.2"
    primaryUpdateStrategy: "unsupervised"
    storage:
      size: "20Gi"
    database: "enterprise_db"
    owner: "app_user"
    password: "secure_password"
    credentials:
      secretName: "postgres-cluster-app"
    backup:
      destinationPath: "s3://postgres-backups/"
      retentionPolicy: "30 days"
      wal:
        compression: "gzip"
        maxParallel: 2
      data:
        compression: "gzip"
    scheduledBackup:
      enabled: true
      name: "postgres-daily-backup"
      schedule: "0 0 2 * * *"

# 2. Event Streaming Layer (Kafka KRaft Mode)
messagingTier:
  kafka:
    enabled: true
    name: "kafka-broker"
    replicas: 1
    image:
      repository: "confluentinc/cp-kafka"
      tag: "7.6.0"
      pullPolicy: "IfNotPresent"
    clusterId: "4L62EnnTQNmGQQuUhqwawA"
    nodeId: "1"
    storage:
      size: "15Gi"
    resources:
      limits:
        cpu: "1000m"
        memory: "1536Mi"
      requests:
        cpu: "250m"
        memory: "768Mi"
    topics:
      userEvents: "user.lifecycle.events"
      articleEvents: "article.lifecycle.events"
      initJob:
        enabled: true

# 3. Application Layer (Django REST Framework)
appTier:
  cache:
    enabled: true
    name: api-cache
    image:
      repository: valkey/valkey
      tag: 8.1.1-alpine
      pullPolicy: IfNotPresent
    port: 6379
    maxMemory: 256mb
    resources:
      limits:
        cpu: "500m"
        memory: "384Mi"
      requests:
        cpu: "50m"
        memory: "96Mi"
  django:
    enabled: true
    cache:
      ttlSeconds: 60
    name: "django-api"
    replicas: 2
    image:
      repository: "ghcr.io/abdelkderboukert/django-enterprise-api"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    secretKey: "django-insecure-enterprise-production-key-change-in-vault-immediately"
    debug: false
    allowedHosts: "api.enterprise.local,django-service,django-service.app-tier.svc.cluster.local,localhost,127.0.0.1"
    logLevel: "INFO"
    service:
      name: "django-service"
      port: 80
      targetPort: 8000
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "200m"
        memory: "256Mi"
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: true
      minAvailable: 1

# 4. Edge Routing Layer (Kong API Gateway)
edgeRouting:
  kong:
    enabled: true
    ingressClass: "kong"
    host: "api.enterprise.local"
    ingressConfigName: "django-ingress-config"
    ingressName: "django-kong-ingress"
    rateLimiting:
      enabled: true
      minute: 120
    correlationId:
      enabled: true
      headerName: "X-Request-ID"
    prometheus:
      enabled: true
