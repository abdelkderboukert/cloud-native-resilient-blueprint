name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/django-enterprise-api

jobs:
  # ============================================================================
  # 1. Hardcoded Secret, Pattern & File Integrity Scanning
  # ============================================================================
  secret-and-pattern-scan:
    name: Secret & Pattern Security Auditing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Hardcoded Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Trivy Filesystem Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Pattern Tools
        run: |
          pip install yamllint flake8

      - name: YAML Pattern & Formatting Linting
        run: |
          yamllint -c .yamllint.yml deploy/ .github/ docker-compose.yml

      - name: Python Antipattern & Syntax Check
        run: |
          flake8 src/django-enterprise-api --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Local DevSecOps Pattern Audit
        run: |
          python scripts/security-scan.py

  # ============================================================================
  # 2. Dependency Vulnerability Auditing
  # ============================================================================
  dependency-audit:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python Dependencies for CVEs
        run: |
          pip-audit -r src/django-enterprise-api/requirements.txt --desc on

      - name: Trivy Filesystem Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'src/django-enterprise-api'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

  # ============================================================================
  # 3. Helm Chart Validation & Trivy Misconfiguration Scan
  # ============================================================================
  helm-trivy-scan:
    name: Helm Lint & Trivy Misconfiguration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.2'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python Helm Chart Structural Validator
        run: |
          python scripts/validate-helm.py

      - name: Helm Lint
        run: |
          helm lint deploy/helm/enterprise-platform

      - name: Helm Template Dry-Run Compilation
        run: |
          helm template enterprise-platform deploy/helm/enterprise-platform \
            --values deploy/helm/enterprise-platform/values.yaml > compiled-helm.yaml

      - name: Trivy Helm Misconfiguration Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'deploy/helm/enterprise-platform'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 4. Django Test, Docker Build, Trivy Image Scan & Container Push
  # ============================================================================
  django-build-test-scan-push:
    name: Build, Test, Scan & Push Django Image
    needs: [secret-and-pattern-scan, dependency-audit, helm-trivy-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r src/django-enterprise-api/requirements.txt

      - name: Execute Django Unit & Integration Test Suite
        env:
          USE_SQLITE: "True"
          KAFKA_TEST_MODE: "True"
          DJANGO_TESTING: "1"
        run: |
          cd src/django-enterprise-api
          python manage.py test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: src/django-enterprise-api
          file: src/django-enterprise-api/Dockerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Scan Django Image with Trivy for Vulnerabilities & Secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Hardened Django Image to Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: src/django-enterprise-api
          file: src/django-enterprise-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
