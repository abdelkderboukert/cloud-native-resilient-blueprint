version: "3.8"

networks:
  data-tier:
    name: eemp-data-tier
  messaging-tier:
    name: eemp-messaging-tier
  app-tier:
    name: eemp-app-tier
  edge-tier:
    name: eemp-edge-tier

volumes:
  rustfs_data:
  postgres_data:
  kafka_data:

services:
  # -------------------------------------------------------------
  # 1. Object Storage Layer: RustFS / S3 Compatible Storage
  # -------------------------------------------------------------
  rustfs:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: eemp-rustfs
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY:-enterprise-admin-key}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-enterprise-super-secret-key-32chars}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - data-tier
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3 bucket provisioner for postgres-backups
  rustfs-init:
    image: minio/mc:latest
    container_name: eemp-rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    networks:
      - data-tier
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://rustfs:9000 ${RUSTFS_ACCESS_KEY:-enterprise-admin-key} ${RUSTFS_SECRET_KEY:-enterprise-super-secret-key-32chars};
      mc mb --ignore-existing local/postgres-backups;
      exit 0;
      "

  # -------------------------------------------------------------
  # 2. Stateful Database Layer: PostgreSQL 16 (CNPG Compatible)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eemp-postgres
    environment:
      POSTGRES_DB: enterprise_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-tier
      - app-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d enterprise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. Event Streaming Layer: Apache Kafka (KRaft Mode)
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eemp-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      CLUSTER_ID: "4L62EnnTQNmGQQuUhqwawA"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - messaging-tier
      - app-tier
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka Topic Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eemp-kafka-init
    depends_on:
      kafka:
        condition: service_started
    networks:
      - messaging-tier
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Kafka to be ready...';
      sleep 10;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.lifecycle.events --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic article.lifecycle.events --partitions 3 --replication-factor 1;
      echo 'Kafka enterprise topics initialized successfully.';
      "

  # -------------------------------------------------------------
  # 4. Application Layer: Django REST Framework API
  # -------------------------------------------------------------
  api-cache:
    image: valkey/valkey:8.1.1-alpine
    container_name: eemp-api-cache
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - app-tier
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  django-api:
    build:
      context: ./src/django-enterprise-api
      dockerfile: Dockerfile
    container_name: eemp-django-api
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: enterprise_platform.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-production-secret-change-me}
      DEBUG: "False"
      ALLOWED_HOSTS: "api.enterprise.local,django-api,localhost,127.0.0.1,kong"
      DATABASE_URL: "postgres://app_user:secure_password@postgres:5432/enterprise_db"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_USER_EVENTS_TOPIC: "user.lifecycle.events"
      KAFKA_ARTICLE_EVENTS_TOPIC: "article.lifecycle.events"
      REDIS_URL: "redis://api-cache:6379/0"
      API_CACHE_ENABLED: "True"
      API_CACHE_TTL: "60"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      api-cache:
        condition: service_healthy
    networks:
      - app-tier
      - edge-tier
      - data-tier
      - messaging-tier
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 5. Edge Routing Layer: Kong API Gateway
  # -------------------------------------------------------------
  kong:
    image: kong:3.6-ubuntu
    container_name: eemp-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:80, 0.0.0.0:443 ssl"
    volumes:
      - ./config/kong/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "80:80"
      - "443:443"
      - "8001:8001"
    depends_on:
      - django-api
    networks:
      - edge-tier
